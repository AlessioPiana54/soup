# Static analysis of the host (soup/) and of the server/ part of the
# packages, run by scripts/lint.py (see there for how the packages, imported
# at runtime as soup_pkg_<name>, are checked by mypy). pytest keeps its own
# pytest.ini.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["instance"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["soup", "tests"]

[tool.ruff.lint.per-file-ignores]
# Literal values in assertions are the point of a test.
"tests/**" = ["PLR2004"]
"../soup-packages/*/tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
show_error_codes = true
# ToolAccess.typed(name, Port) takes the abstract port classes of the contracts
# (Catalog, Preferences...) on purpose: it only uses them for isinstance().
disable_error_code = ["type-abstract"]

[tool.vulture]
min_confidence = 80
paths = ["soup", "../soup-packages", "scripts/vulture_whitelist.py"]
exclude = ["*/tests/*", "*/node_modules/*", "*/app/*", "*/_template/*"]

[tool.coverage.run]
source = ["soup", "../soup-packages"]
omit = ["*/tests/*", "*/node_modules/*", "*/app/*", "*/conftest.py"]

[tool.coverage.report]
skip_empty = true
